name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-xlarge
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build unsigned app
        run: |
          xcodebuild -project LibreTV.xcodeproj -scheme LibreTV -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Allow plain HTTP (LAN / IPv6 direct)
        run: |
          PLIST="build/Build/Products/Release-iphoneos/LibreTV.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$PLIST"
      - name: Verify app icon is bundled
        run: |
          ls -la build/Build/Products/Release-iphoneos/LibreTV.app | grep -i icon || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "build/Build/Products/Release-iphoneos/LibreTV.app/Info.plist" || true
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/LibreTV.app Payload/
          zip -r LibreTV.ipa Payload
          ls -lh LibreTV.ipa
          unzip -l LibreTV.ipa | head -40
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreTV-ipa
          path: LibreTV.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" LibreTV.ipa --title "LibreTV build ${{ github.run_number }}" --notes "LibreTV 未签名 IPA：保留原 LOGO；新增 IPv6 直连与局域网连接；自动检测所有线路延迟并显示具体毫秒数值，最快线路自动置顶推荐，公网中转兜底。可用直装工具签名安装。"
